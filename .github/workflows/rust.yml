name: Rust

# Format, lint and tests for the Rust crates on macOS and Linux, lint, unit,
# fixture, discovery and memory read/write tests on Windows, the Rune app
# (build, wasm check, Runtime tests, headless goldens) on Linux, plus the
# parity check: the Rust CLI against the TS CLI results recorded in
# tests/goldens. Recording goldens and the live TS-vs-Rust run are in
# rust-live.yml.

# Push runs only on `rust`: a push to a `rust-*` branch with an open PR
# already starts a pull_request run, so a push run there would double it.
on:
  push:
    branches:
      - rust
  pull_request:
    branches:
      - rust
      - "rust-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install toolchain
        # rust-toolchain.toml pins the version and components.
        run: rustup toolchain install || rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      # Clippy runs on both: some code is macOS only.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  windows:
    # Lint, unit tests, the fixture listing, Codex/Pi discovery, memory
    # reads, writes and path containment, and the telemetry store. The CLI
    # end-to-end tests drive a POSIX HOME, so they stay off.
    name: check (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install || rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked --lib --bins

      - name: Fixture listing, agent discovery and memory files
        run: >-
          cargo test --locked -p peektrace-core
          --test fixtures --test discovery --test codex --test pi
          --test pi_context_edit --test memory --test memory_fs

      - name: Telemetry store and layer
        run: cargo test --locked -p peektrace-telemetry --test writer --test layer

  ui:
    # The Rune app (crates/ui, crates/app) sits outside default-members, so
    # the jobs above never build its ~600 crates. Headless renders always
    # open a GPU adapter: lavapipe gives one in software.
    name: rune ui (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          rustup toolchain install || rustup show
          rustup target add wasm32-unknown-unknown

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Linux packages
        # xkbcommon and wayland headers for the build; lavapipe (software
        # Vulkan) for headless --snap and --tree.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev mesa-vulkan-drivers

      - name: Clippy
        run: cargo clippy --locked -p peektrace-ui -p peektrace-app --all-targets -- -D warnings

      - name: wasm check
        run: cargo check --locked -p peektrace-app --target wasm32-unknown-unknown

      - name: Tests (unit, Runtime, drift, headless goldens)
        run: |
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          cargo test --locked -p peektrace-ui -p peektrace-app

      - name: Snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rune-snaps
          path: target/rune-snaps
          if-no-files-found: ignore

  goldens:
    # Keeps the old check name for branch rules. Only the Rust side runs:
    # the TS side comes from tests/goldens. A `record-goldens` PR label
    # re-records them (rust-live.yml, scripts/rust/README.md).
    name: parity (fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install || rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: parity
          cache-on-failure: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The fixture builders and the TUI stage import TS modules.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the inspector (embedded in the binary)
        run: bun run --filter=inspector build

      # One cargo call: a second one for the examples resolves features again.
      # The ui helpers probe needs only the pure model, so Rune stays off.
      - name: Build (parity profile)
        run: |
          cargo build --locked --profile parity --bins --examples
          cargo build --locked --profile parity -p peektrace-ui --no-default-features --examples

      - name: Rust against the goldens
        run: bun scripts/rust/goldens.ts --bin target/parity/peektrace
