name: Rust

# Format, lint and tests for the Rust crates on macOS and Linux, lint, unit,
# fixture, discovery and memory read/write tests on Windows, plus the parity
# harness that diffs the Rust CLI against the TS CLI on fixtures.

# Push runs only on `rust`: a push to a `rust-*` branch with an open PR
# already starts a pull_request run, so a push run there would double it.
on:
  push:
    branches:
      - rust
  pull_request:
    branches:
      - rust
      - "rust-*"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install toolchain
        # rust-toolchain.toml pins the version and components.
        run: rustup toolchain install || rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  windows:
    # Lint, unit tests, the fixture listing, Codex/Pi discovery and memory
    # reads, writes and path containment. The CLI end-to-end tests drive a
    # POSIX HOME, so they stay off.
    name: check (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install || rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked --lib --bins

      - name: Fixture listing, agent discovery and memory files
        run: >-
          cargo test --locked -p peektrace-core
          --test fixtures --test discovery --test codex --test pi
          --test pi_context_edit --test memory --test memory_fs

  parity:
    name: parity (fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install || rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release binary
        run: cargo build --locked --release

      - name: Parity against the TS CLI
        run: bun scripts/rust/parity.ts --fixtures-only
