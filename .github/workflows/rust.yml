name: Rust

# Format, lint and tests for the Rust crates on macOS and Linux, lint, unit,
# fixture, discovery and memory read/write tests on Windows, plus the parity
# check: the Rust CLI against the TS CLI results recorded in tests/goldens.
# A nightly (or manual, or `parity-live` labelled PR) job runs the full live
# harness, TS and Rust side by side, so goldens that drift from TS show up.

# Push runs only on `rust` (and `rust-ci-goldens`, to measure this setup):
# a push to a `rust-*` branch with an open PR already starts a
# pull_request run, so a push run there would double it.
on:
  push:
    branches:
      - rust
      - rust-ci-goldens
  pull_request:
    branches:
      - rust
      - "rust-*"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    name: check (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install toolchain
        # rust-toolchain.toml pins the version and components.
        run: rustup toolchain install || rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      # Clippy runs on both: some code is macOS only.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  windows:
    # Lint, unit tests, the fixture listing, Codex/Pi discovery, memory
    # reads, writes and path containment, and the telemetry store. The CLI
    # end-to-end tests drive a POSIX HOME, so they stay off.
    name: check (windows-latest)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install || rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked --lib --bins

      - name: Fixture listing, agent discovery and memory files
        run: >-
          cargo test --locked -p peektrace-core
          --test fixtures --test discovery --test codex --test pi
          --test pi_context_edit --test memory --test memory_fs

      - name: Telemetry store and layer
        run: cargo test --locked -p peektrace-telemetry --test writer --test layer

  goldens:
    # Keeps the old check name for branch rules. Only the Rust side runs:
    # the TS side comes from tests/goldens (bun scripts/rust/goldens.ts
    # --write regenerates them; see scripts/rust/README.md).
    name: parity (fixtures)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install || rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: parity
          cache-on-failure: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The fixture builders and the TUI stage import TS modules.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the inspector (embedded in the binary)
        run: bun run --filter=inspector build

      # One cargo call: a second one for the examples resolves features again.
      - name: Build (parity profile)
        run: cargo build --locked --profile parity --bins --examples

      - name: Rust against the goldens
        run: bun scripts/rust/goldens.ts --bin target/parity/peektrace

  parity-live:
    # The full harness, TS and Rust side by side, then a fresh recording
    # compared with tests/goldens. Schedule and manual runs fire only once
    # this file is on the default branch; until then, label a PR
    # `parity-live` or run it locally.
    name: parity live (TS vs Rust)
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'parity-live'))
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install || rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: parity
          save-if: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the inspector (embedded in the binary)
        run: bun run --filter=inspector build

      - name: Build (parity profile)
        run: cargo build --locked --profile parity --bins --examples

      - name: Parity against the TS CLI
        run: bun scripts/rust/parity.ts --fixtures-only --bin target/parity/peektrace

      - name: Goldens match a fresh recording
        if: success() || failure()
        run: bun scripts/rust/goldens.ts --verify --bin target/parity/peektrace
