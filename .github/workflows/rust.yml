name: Rust

# Format, lint and tests for the Rust crates on macOS and Linux, lint, unit,
# fixture, discovery and memory read/write tests on Windows, plus the parity
# harness that diffs the Rust CLI against the TS CLI on fixtures.

# Push runs only on `rust`: a push to a `rust-*` branch with an open PR
# already starts a pull_request run, so a push run there would double it.
on:
  push:
    branches:
      - rust
  pull_request:
    branches:
      - rust
      - "rust-*"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install toolchain
        # rust-toolchain.toml pins the version and components.
        run: rustup toolchain install || rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  windows:
    # Lint, unit tests, the fixture listing, Codex/Pi discovery, memory
    # reads, writes and path containment, and the telemetry store. The CLI
    # end-to-end tests drive a POSIX HOME, so they stay off.
    name: check (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install || rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked --lib --bins

      - name: Fixture listing, agent discovery and memory files
        run: >-
          cargo test --locked -p peektrace-core
          --test fixtures --test discovery --test codex --test pi
          --test pi_context_edit --test memory --test memory_fs

      - name: Telemetry store and layer
        run: cargo test --locked -p peektrace-telemetry --test writer --test layer

  parity-build:
    # Builds once; each stage job below restores the binary, the examples
    # and the inspector build from the cache and needs no Rust toolchain.
    name: parity build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install || rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the inspector (embedded in the binary)
        run: bun run --filter=inspector build

      - name: Build release binary
        run: |
          cargo build --locked --release
          cargo build --locked --release -p peektrace-core -p peektrace-tui --examples

      - name: Save the build
        uses: actions/cache/save@v4
        with:
          key: parity-bin-${{ github.sha }}
          path: |
            target/release/peektrace
            target/release/examples/highlight
            target/release/examples/views
            apps/inspector/dist

  parity:
    name: parity (${{ matrix.stage }})
    needs: parity-build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { stage: base, timeout: 45 }
          - { stage: stats, timeout: 30 }
          - { stage: serve, timeout: 30 }
          - { stage: search, timeout: 25 }
          - { stage: memory, timeout: 20 }
          - { stage: cli, timeout: 20 }
          - { stage: tui, timeout: 20 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore the build
        uses: actions/cache/restore@v4
        with:
          key: parity-bin-${{ github.sha }}
          fail-on-cache-miss: true
          path: |
            target/release/peektrace
            target/release/examples/highlight
            target/release/examples/views
            apps/inspector/dist

      - name: Parity against the TS CLI
        run: >-
          bun scripts/rust/parity.ts --fixtures-only
          --${{ matrix.stage }}-only --bin target/release/peektrace

  parity-done:
    # Keeps the old check name for branch rules.
    name: parity (fixtures)
    needs: parity
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Every stage passed
        if: needs.parity.result != 'success'
        run: exit 1
