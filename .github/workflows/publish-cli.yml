name: Publish CLI

run-name: "publish cli ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

# Releases the `peektrace` CLI binaries. A push of a `cli-v<semver>` tag drives
# an automatic release; workflow_dispatch stays available for repair runs. The
# tag is the source of truth for the version: the workflow strips `cli-v`,
# stamps the bare semver into apps/cli/package.json, then build:npm
# cross-compiles all five platform binaries on this one host and stages them
# under dist-npm/.
#
# Native installers are the ONLY distribution channel right now. The staged
# binaries are published as raw assets on the GitHub Release for the tag
# (peektrace-darwin-arm64, peektrace-darwin-x64, peektrace-linux-x64,
# peektrace-linux-arm64, peektrace-windows-x64.exe + a SHA256SUMS), which the
# curl|sh / irm|iex installers (scripts/install.sh, scripts/install.ps1)
# download. Both Linux binaries are glibc-only; musl (Alpine) is not shipped.
#
# Each binary
# also ships a gzipped copy (<asset>.gz, what everything downloads by default)
# and, when it is small enough to be worth it, a delta patch from the previous
# cli-v* release (<asset>.patch) that `peektrace upgrade` applies in place.
# SHA256SUMS records the UNCOMPRESSED digest, which stays the trust anchor for
# every route. The job runs on
# macOS so both darwin binaries can be ad-hoc codesigned (free, no Apple
# account) — without a signature a cross-compiled arm64 binary is 'killed: 9' by
# the kernel on first launch.
#
# npm is the second channel: `npx peektrace`. The publish step no-ops unless the
# NPM_TOKEN secret is set, so releases keep working before the registry side is
# wired up. build-npm.ts is also what produces the binaries released here, so the
# staging build runs either way.
#
# npm layout (see apps/cli/scripts/build-npm.ts): five scoped per-platform
# packages `@peektrace/cli-<platform>-<arch>` (each os/cpu-filtered) plus the
# unscoped `peektrace` wrapper whose optionalDependencies pin those variants at
# the exact version. The variants MUST publish before the wrapper so its optional
# deps resolve. Requires the `peektrace` npm org.

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. cli-v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # macOS runner so both darwin binaries can be ad-hoc codesigned before
    # release (see header). Bun cross-compiles all five targets from here.
    runs-on: macos-latest
    timeout-minutes: 30

    # Consumed by smoke-linux, which pins the installer to this exact tag.
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Derive version from tag
        id: version
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RAW_TAG#cli-v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$RAW_TAG' does not yield a valid semver (got '$VERSION'). Expected cli-v<semver>." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$RAW_TAG" >> "$GITHUB_ENV"
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing peektrace@$VERSION ($RAW_TAG)"

      # `--cpu='*' --os='*'` pulls EVERY optional platform dependency, not just
      # the runner's. @opentui/core resolves its native Zig library through
      # per-platform optional deps (`@opentui/core-<platform>-<arch>`), and
      # `bun build --compile` folds `process.platform`/`process.arch` to the
      # target's values, so a cross-compile statically imports the TARGET's
      # native package. Without these flags the arm64 macOS runner only has
      # `@opentui/core-darwin-arm64` installed and the other four targets fail
      # with "Could not resolve: @opentui/core-linux-x64". The lockfile already
      # records all variants, so `--frozen-lockfile` still holds.
      - name: Install dependencies
        run: bun install --frozen-lockfile --cpu='*' --os='*'

      # Stamp AFTER install so the frozen lockfile check sees the committed
      # version. Use `npm pkg set` rather than `npm version`: the latter resolves
      # dependencies and chokes on the `workspace:*` protocol (EUNSUPPORTEDPROTOCOL),
      # while `npm pkg set` just rewrites the version field. build-npm.ts re-reads
      # apps/cli/package.json at build time and stamps VERSION into the wrapper,
      # every variant, and the wrapper's optionalDependencies, so they all match.
      - name: Stamp CLI version
        run: npm pkg set version="$VERSION"
        working-directory: apps/cli

      - name: Build inspector UI
        run: bun run --filter=inspector build

      - name: Stage npm packages
        run: bun run --filter=peektrace build:npm

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # No token: skip rather than fail, so the GitHub Release (the other
          # distribution channel, below) still goes out.
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN not set — skipping npm publish."
            exit 0
          fi

          # Idempotent publish: skip if the exact name@version already exists,
          # and treat a race where npm reports it as already published as
          # success — so a partially-failed run is safe to retry.
          publish_dir() {
            local dir="$1"
            local name version
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Skip: $name@$version already published."
              return 0
            fi
            echo "Publishing $name@$version"
            local out
            if out="$(npm publish "$dir" --access public 2>&1)"; then
              printf '%s\n' "$out"
              return 0
            fi
            printf '%s\n' "$out"
            if printf '%s' "$out" | grep -Eqi 'previously published|cannot publish over|version already exists'; then
              echo "Treating as already published: $name@$version"
              return 0
            fi
            return 1
          }

          # Per-platform variants FIRST (sequentially — the registry 409s on
          # concurrent packument writes), then the wrapper LAST so its
          # optionalDependencies already exist in the registry.
          for d in apps/cli/dist-npm/@peektrace/cli-*; do
            publish_dir "$d"
          done
          publish_dir "apps/cli/dist-npm/peektrace"

      # Collect the five already-compiled binaries from the staged npm packages
      # and rename them to the SHARED-CONTRACT release-asset names the installers
      # (scripts/install.sh / scripts/install.ps1) download.
      - name: Collect release binaries
        shell: bash
        run: |
          set -euo pipefail
          DIST=apps/cli/dist-npm/@peektrace
          mkdir -p release
          cp "$DIST/cli-darwin-arm64/bin/peektrace"    release/peektrace-darwin-arm64
          cp "$DIST/cli-darwin-x64/bin/peektrace"      release/peektrace-darwin-x64
          cp "$DIST/cli-linux-x64/bin/peektrace"       release/peektrace-linux-x64
          cp "$DIST/cli-linux-arm64/bin/peektrace"     release/peektrace-linux-arm64
          cp "$DIST/cli-win32-x64/bin/peektrace.exe"   release/peektrace-windows-x64.exe
          chmod +x release/peektrace-darwin-arm64 release/peektrace-darwin-x64 \
                   release/peektrace-linux-x64 release/peektrace-linux-arm64
          ls -l release

      # Ad-hoc sign BOTH darwin binaries (free, no Apple account). A
      # cross-compiled unsigned arm64 binary is 'killed: 9' on first launch;
      # signing here + curl-install (no quarantine attr) means it just runs.
      - name: Ad-hoc codesign macOS binaries
        shell: bash
        run: |
          set -euo pipefail
          for bin in release/peektrace-darwin-arm64 release/peektrace-darwin-x64; do
            codesign --sign - --force --timestamp=none "$bin"
            codesign --verify --verbose "$bin"
          done

      # Gzipped copies of every binary. These are what the installers and
      # `peektrace upgrade` download by default — roughly a third of the raw
      # size — with the uncompressed asset kept as the fallback (and as the
      # integrity anchor: SHA256SUMS records the UNCOMPRESSED digest, so both
      # routes verify against the same line).
      - name: Compress release binaries
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          for bin in peektrace-*; do
            gzip -9 -c "$bin" > "$bin.gz"
            printf '%s: %s -> %s bytes\n' "$bin" "$(wc -c < "$bin")" "$(wc -c < "$bin.gz")"
          done

      # Delta patches. `peektrace upgrade` reads <asset>.patch off the release
      # to walk an installed binary forward one release at a time instead of
      # re-downloading ~110 MB; binpatch's githubReleaseSource expects exactly
      # this asset naming plus the .gz above (whose size it uses as the budget).
      #
      # The wire format is TRDIFF10 (bsdiff + zstd) from zig-bsdiff — the same
      # generator binpatch's own composite action installs. That action is not
      # used directly because its previous-release lookup takes the newest
      # release outright, and this repo interleaves desktop-v* tags.
      - name: Install zig-bsdiff
        shell: bash
        env:
          BSDIFF_VERSION: "0.1.19"
          BSDIFF_SHA256: e4ae17e632774de5b5c61fa32cb2d79fa9aa5b1fff3d174f2c54f7f0f666dab0
        run: |
          set -euo pipefail
          TARBALL="zig-bsdiff-darwin-arm64.tar.gz"
          curl --retry 3 --retry-delay 5 --retry-all-errors -sfLo "$TARBALL" \
            "https://github.com/blackboardsh/zig-bsdiff/releases/download/v${BSDIFF_VERSION}/${TARBALL}"
          echo "${BSDIFF_SHA256}  ${TARBALL}" | shasum -a 256 -c -
          sudo tar -xz -C /usr/local/bin < "$TARBALL"
          rm "$TARBALL"

      # Diff against the previous cli-v* release. Patches are generated from the
      # SIGNED darwin binaries (this runs after the codesign step) so a patched
      # binary is byte-identical to the released one and keeps its signature.
      #
      # Best-effort: no previous release, a missing asset, or a patch too large
      # to be worth downloading just means that platform ships without a patch
      # this release and clients fall back to the full download.
      - name: Generate delta patches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Gate well under binpatch's client-side 60%-of-gzip ceiling. A
          # release that moves Bun's own runtime bytes lands far above this.
          MAX_RATIO: "50"
        run: |
          set -euo pipefail
          PREV_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.draft == false and (.tag_name | startswith(\"cli-v\")) and .tag_name != \"$TAG\")] | .[0].tag_name // empty")"

          if [ -z "$PREV_TAG" ]; then
            echo "No previous cli-v* release; publishing without patches."
            exit 0
          fi
          echo "Diffing against $PREV_TAG"

          mkdir -p old
          for bin in release/peektrace-*; do
            name="$(basename "$bin")"
            case "$name" in *.gz | *.patch) continue ;; esac

            # Prefer the previous release's .gz; releases predating it only
            # carry the raw asset.
            if gh release download "$PREV_TAG" --repo "$GITHUB_REPOSITORY" \
                 --pattern "$name.gz" --dir old 2>/dev/null; then
              gunzip -f "old/$name.gz"
            elif ! gh release download "$PREV_TAG" --repo "$GITHUB_REPOSITORY" \
                   --pattern "$name" --dir old 2>/dev/null; then
              echo "::warning::$PREV_TAG has no $name; skipping its patch."
              continue
            fi

            bsdiff "old/$name" "$bin" "release/$name.patch" --use-zstd

            patch_size="$(wc -c < "release/$name.patch")"
            gz_size="$(wc -c < "release/$name.gz")"
            ratio="$(awk "BEGIN { printf \"%.0f\", ($patch_size / $gz_size) * 100 }")"
            if [ "$ratio" -gt "$MAX_RATIO" ]; then
              echo "::warning::$name.patch is ${ratio}% of the gzipped binary (limit ${MAX_RATIO}%); dropping it."
              rm "release/$name.patch"
            else
              echo "$name.patch: $patch_size bytes (${ratio}% of gzipped)"
            fi
            rm -f "old/$name"
          done

      # Checksums the installers verify. Lines: "<sha256>  <asset>". Covers the
      # binaries, their .gz copies and the patches.
      - name: Generate SHA256SUMS
        working-directory: release
        run: shasum -a 256 peektrace-* > SHA256SUMS

      # Create the Release for this tag if missing, then (re)upload every asset.
      - name: Publish GitHub Release with raw binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
          # Globbed rather than listed: the binaries, their .gz copies and
          # whichever .patch files survived the size gate.
          gh release upload "$TAG" \
            release/peektrace-* \
            release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber

  # End-to-end check of the published release on real Linux hardware, one job per
  # arch. The publish job builds every target on macOS and can execute none of
  # them, so this is the only place a cross-compiled Linux binary actually runs.
  # It drives the real scripts/install.sh, which also covers uname-based arch
  # detection, asset naming and checksum verification.
  #
  # Runs AFTER publish because it installs from the release, so it cannot gate
  # one — a failure flags a release to repair via workflow_dispatch. `ubuntu-*-arm`
  # runners are free for public repos.
  smoke-linux:
    needs: publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Pinned to the tag just published, so this never races the "newest
      # cli-v*" API lookup.
      - name: Install from the published release
        env:
          PEEKTRACE_VERSION: ${{ needs.publish.outputs.tag }}
          PEEKTRACE_INSTALL_DIR: ${{ runner.temp }}/peektrace-bin
        run: sh scripts/install.sh

      # `serve` is the headless path a VPS actually uses: it boots the server and
      # serves the embedded inspector UI, which proves the assets survived the
      # cross-compile. The TUI needs a TTY and is not exercised here. `--no-open`
      # because a runner has no `xdg-open` to spawn.
      - name: Run the installed binary
        env:
          BIN: ${{ runner.temp }}/peektrace-bin/peektrace
        shell: bash
        run: |
          set -euo pipefail
          "$BIN" --version
          "$BIN" --help > /dev/null

          "$BIN" serve --port 47321 --no-open &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:47321/; then
              echo "serve responded on ${{ matrix.arch }}"
              exit 0
            fi
            sleep 1
          done
          echo "::error::serve never responded on ${{ matrix.arch }}" >&2
          exit 1
