name: Publish CLI

run-name: "publish cli ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

# Releases the `peektrace` CLI, the Rust binary built from crates/cli. A push of
# a `cli-v<semver>` tag drives an automatic release; workflow_dispatch stays
# available for repair runs. The tag is the source of truth for the version: the
# workflow strips `cli-v` and bakes the bare semver into the binary at compile
# time (`PEEKTRACE_VERSION`). The Cargo workspace version stays 0.0.0.
#
# Jobs:
#   version    checks the tag and derives the version.
#   inspector  builds apps/inspector/dist once. Every binary embeds this copy.
#   build      one native runner per target. Both darwin targets build on
#              macos-latest and get an ad-hoc signature (free, no Apple account;
#              an unsigned arm64 binary is 'killed: 9' on first launch).
#   publish    collects the five binaries, creates the GitHub Release, then
#              publishes npm LAST.
#   smoke-linux installs the published release on real Linux x64 and arm64.
#
# Release assets, which scripts/install.sh, scripts/install.ps1 and
# `peektrace upgrade` (crates/cli/src/upgrade) download:
#   peektrace-darwin-arm64, peektrace-darwin-x64, peektrace-linux-x64,
#   peektrace-linux-arm64, peektrace-windows-x64.exe
# each with a gzipped copy (<asset>.gz, what everything downloads by default),
# plus SHA256SUMS. SHA256SUMS lists the UNCOMPRESSED binaries only: every route
# verifies the bytes it installs against that line. Both Linux binaries are
# glibc-only, built on Ubuntu 22.04 so they need glibc 2.35 or newer; musl
# (Alpine) is not shipped. `upgrade` downloads whole binaries,
# so no delta patches are published.
#
# Release notes come from the matching `## <tag>` section of CHANGELOG.md
# (scripts/release/release-notes.ts); a tag with no section gets GitHub's
# generated notes. To backfill an old release without rebuilding it (a
# workflow_dispatch run builds and uploads binaries from the dispatched branch):
#   bun scripts/release/release-notes.ts cli-v0.8.0 \
#     | gh release edit cli-v0.8.0 --repo Mark-Life/peektrace --notes-file -
#
# npm is the second channel: `npx peektrace`. It publishes after the GitHub
# Release, so a registry failure costs the npm channel and nothing else.
#
# npm layout (scripts/release/build-npm.ts stages it from the release binaries):
# five scoped per-platform packages `@peektrace/cli-<platform>-<arch>` (each
# os/cpu-filtered) plus the unscoped `peektrace` wrapper whose
# optionalDependencies pin those variants at the exact version. The variants
# MUST publish before the wrapper so its optional deps resolve. Requires the
# `peektrace` npm org.
#
# npm auth is TRUSTED PUBLISHING (OIDC): there is no NPM_TOKEN. Each of the six
# packages names Mark-Life/peektrace + publish-cli.yml as its trusted publisher
# on npmjs.com, and the publish job's `id-token: write` permission is what lets
# npm mint a credential scoped to a single run. A package can only be configured
# after it exists, so each name was bootstrapped with a manual 0.0.0 placeholder
# publish.

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. cli-v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Derive version from tag
        id: version
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RAW_TAG#cli-v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$RAW_TAG' does not yield a valid semver (got '$VERSION'). Expected cli-v<semver>." >&2
            exit 1
          fi
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing peektrace@$VERSION ($RAW_TAG)"

  inspector:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build inspector UI
        run: bun run --filter=inspector build

      - name: Upload inspector build
        uses: actions/upload-artifact@v4
        with:
          name: inspector-dist
          path: apps/inspector/dist
          if-no-files-found: error
          retention-days: 1

  build:
    name: build (${{ matrix.asset }})
    needs: [version, inspector]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: peektrace-darwin-arm64
          - runner: macos-latest
            target: x86_64-apple-darwin
            asset: peektrace-darwin-x64
          # 22.04 sets the glibc floor at 2.35 (Ubuntu 22.04, Debian 12).
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: peektrace-linux-x64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: peektrace-linux-arm64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: peektrace-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # crates/server embeds apps/inspector/dist into release builds.
      - name: Download inspector build
        uses: actions/download-artifact@v4
        with:
          name: inspector-dist
          path: apps/inspector/dist

      - name: Install toolchain
        shell: bash
        # rust-toolchain.toml pins the version and components.
        run: |
          rustup toolchain install || rustup show
          rustup target add ${{ matrix.target }}

      # `https` adds TLS, which `upgrade` and `--remote https://` need. The
      # PEEKTRACE_RELEASE_* vars point `upgrade` and the update notice at this
      # repo's releases; a build without all four never offers an upgrade.
      - name: Build
        shell: bash
        env:
          PEEKTRACE_VERSION: ${{ needs.version.outputs.version }}
          PEEKTRACE_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download
          PEEKTRACE_RELEASE_API: https://api.github.com/repos/${{ github.repository }}
          PEEKTRACE_RELEASE_TAG_PREFIX: cli-v
          PEEKTRACE_RELEASE_ASSET_PREFIX: peektrace-
        run: |
          set -euo pipefail
          cargo build --release --locked -p peektrace-cli --features https --target ${{ matrix.target }}
          exe=""
          [ "$RUNNER_OS" = Windows ] && exe=.exe
          mkdir -p out
          cp "target/${{ matrix.target }}/release/peektrace$exe" "out/${{ matrix.asset }}"
          ls -l out

      - name: Ad-hoc codesign
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          codesign --sign - --force --timestamp=none "out/${{ matrix.asset }}"
          codesign --verify --verbose "out/${{ matrix.asset }}"

      - name: Check the glibc floor
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          max="$(objdump -T "out/${{ matrix.asset }}" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/^GLIBC_//' | sort -uV | tail -n1)"
          echo "newest glibc symbol: $max"
          if [ "$(printf '%s\n' "$max" "$GLIBC_FLOOR" | sort -V | tail -n1)" != "$GLIBC_FLOOR" ]; then
            echo "::error::${{ matrix.asset }} needs glibc $max, above the $GLIBC_FLOOR floor" >&2
            exit 1
          fi
        env:
          GLIBC_FLOOR: "2.35"

      # The macOS runner is arm64, so the x64 binary cannot run here.
      - name: Check the binary's version
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          got="$("out/${{ matrix.asset }}" --version | tr -d '\r')"
          if [ "$got" != "$VERSION" ]; then
            echo "::error::${{ matrix.asset }} --version printed '$got', expected '$VERSION'" >&2
            exit 1
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      # Lets the runner mint the OIDC token npm exchanges for a short-lived
      # publish credential. Without it `npm publish` finds no OIDC environment
      # and falls back to token auth, which is not configured.
      id-token: write

    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, which Node 24 does not bundle.
      # Upgrading in place is what makes `npm publish` detect the OIDC
      # environment at all.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: release
          merge-multiple: true

      # Artifacts drop the exec bit. The linux-x64 binary runs on this host:
      # check that it serves the embedded inspector before anything ships.
      - name: Check the binaries
        shell: bash
        run: |
          set -euo pipefail
          chmod +x release/peektrace-darwin-arm64 release/peektrace-darwin-x64 \
                   release/peektrace-linux-x64 release/peektrace-linux-arm64
          ls -l release
          [ "$(find release -type f | wc -l)" -eq 5 ] || { echo "::error::expected 5 binaries" >&2; exit 1; }

          home="$RUNNER_TEMP/home"
          mkdir -p "$home"
          HOME="$home" release/peektrace-linux-x64 serve --port 47321 --no-open &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if page="$(curl -fsS http://127.0.0.1:47321/)"; then
              if [[ "$page" == *'<div id="root">'* ]]; then
                echo "serve answered with the inspector"
                exit 0
              fi
              echo "::error::serve answered, but not with the inspector page" >&2
              exit 1
            fi
            sleep 1
          done
          echo "::error::serve never responded" >&2
          exit 1

      # Gzipped copies, about a third of the raw size, are what the installers
      # and `peektrace upgrade` download first. SHA256SUMS records the
      # UNCOMPRESSED digests, so both routes verify against the same line.
      - name: Compress and checksum
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          sha256sum peektrace-* > SHA256SUMS
          for bin in peektrace-*; do
            gzip -9 -n -c "$bin" > "$bin.gz"
            printf '%s: %s -> %s bytes\n' "$bin" "$(wc -c < "$bin")" "$(wc -c < "$bin.gz")"
          done
          cat SHA256SUMS

      # Create the Release for this tag if missing, then (re)upload every asset.
      # The body is the tag's CHANGELOG.md section; if it is missing (or the
      # extraction fails) a new release falls back to generated notes and an
      # existing release keeps its body.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          if bun scripts/release/release-notes.ts "$TAG" > "$notes"; then
            [ -s "$notes" ] || echo "::warning::no CHANGELOG.md section for $TAG; using generated notes"
          else
            echo "::warning::release notes extraction failed; using generated notes"
            : > "$notes"
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ -s "$notes" ]; then
              notes_args=(--notes-file "$notes")
            else
              notes_args=(--generate-notes)
            fi
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              "${notes_args[@]}" \
              --verify-tag
          elif [ -s "$notes" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          fi
          gh release upload "$TAG" \
            release/peektrace-* \
            release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Stage npm packages
        run: bun scripts/release/build-npm.ts --version "$VERSION" --assets release --out dist-npm

      # LAST on purpose. The GitHub Release feeds the curl/irm installers and
      # `peektrace upgrade`; npm is the second channel, so one registry error
      # must not cost the binaries.
      #
      # Auth is OIDC via trusted publishing (see the header). Publishing from a
      # public repo this way also attaches provenance automatically.
      - name: Publish to npm
        shell: bash
        run: |
          set -euo pipefail

          # Idempotent publish: skip if the exact name@version already exists,
          # and treat a race where npm reports it as already published as
          # success, so a partially-failed run is safe to retry.
          publish_dir() {
            local dir="$1"
            local name version
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Skip: $name@$version already published."
              return 0
            fi
            echo "Publishing $name@$version"
            local out
            if out="$(npm publish "$dir" --access public 2>&1)"; then
              printf '%s\n' "$out"
              return 0
            fi
            printf '%s\n' "$out"
            if printf '%s' "$out" | grep -Eqi 'previously published|cannot publish over|version already exists'; then
              echo "Treating as already published: $name@$version"
              return 0
            fi
            return 1
          }

          # Per-platform variants FIRST (sequentially: the registry 409s on
          # concurrent packument writes), then the wrapper LAST so its
          # optionalDependencies already exist in the registry.
          for d in dist-npm/@peektrace/cli-*; do
            publish_dir "$d"
          done
          publish_dir "dist-npm/peektrace"

  # End-to-end check of the published release on real Linux hardware, one job
  # per arch, on the 22.04 images that set the glibc floor. It drives the
  # real scripts/install.sh, which also covers
  # uname-based arch detection, asset naming and checksum verification.
  #
  # Runs AFTER publish because it installs from the release, so it cannot gate
  # one: a failure flags a release to repair via workflow_dispatch.
  smoke-linux:
    needs: [version, publish]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Pinned to the tag just published, so this never races the "newest
      # cli-v*" API lookup.
      - name: Install from the published release
        env:
          PEEKTRACE_VERSION: ${{ needs.version.outputs.tag }}
          PEEKTRACE_INSTALL_DIR: ${{ runner.temp }}/peektrace-bin
        run: sh scripts/install.sh

      # `serve` is the headless path a VPS uses: it boots the server and serves
      # the embedded inspector UI. The TUI needs a TTY and is not exercised
      # here. `--no-open` because a runner has no `xdg-open` to spawn.
      - name: Run the installed binary
        env:
          BIN: ${{ runner.temp }}/peektrace-bin/peektrace
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$("$BIN" --version)" = "$VERSION" ]
          "$BIN" --help > /dev/null

          "$BIN" serve --port 47321 --no-open &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if page="$(curl -fsS http://127.0.0.1:47321/)" && [[ "$page" == *'<div id="root">'* ]]; then
              echo "serve responded on ${{ matrix.arch }}"
              exit 0
            fi
            sleep 1
          done
          echo "::error::serve never responded on ${{ matrix.arch }}" >&2
          exit 1
