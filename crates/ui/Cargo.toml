[package]
name = "peektrace-ui"
description = "peektrace Rune views, shared by the native app and the web build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
peektrace-js.workspace = true
peektrace-protocol.workspace = true
rune = { workspace = true, optional = true }
rune-kit = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
icu_collator.workspace = true
pulldown-cmark.workspace = true
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
peektrace-core.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "History", "Request", "RequestInit", "RequestMode", "RequestCredentials", "Response", "Headers", "EventSource", "MessageEvent", "Event", "console"] }

[dev-dependencies]
peektrace-core.workspace = true
serde_json.workspace = true

[features]
default = ["view"]
# The Rune views and app shell; off, only the pure model and chart geometry build.
view = ["dep:rune", "dep:rune-kit"]

[[test]]
name = "drift"
required-features = ["view"]

[[test]]
name = "runtime"
required-features = ["view"]

[[test]]
name = "session_list"
required-features = ["view"]

[[test]]
name = "tool_event"
required-features = ["view"]

[lints]
workspace = true
