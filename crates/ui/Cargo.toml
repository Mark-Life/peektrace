[package]
name = "peektrace-ui"
description = "peektrace Rune views, shared by the native app and the web build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
peektrace-protocol.workspace = true
rune.workspace = true
rune-kit.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
icu_collator.workspace = true
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
peektrace-core.workspace = true
jiff.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "History", "Request", "RequestInit", "RequestMode", "RequestCredentials", "Response", "Headers", "EventSource", "MessageEvent", "Event", "console"] }

[dev-dependencies]
peektrace-core.workspace = true
serde_json.workspace = true

[lints]
workspace = true
