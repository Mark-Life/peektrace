[package]
name = "peektrace-cli"
description = "peektrace command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "peektrace"
path = "src/main.rs"

[dependencies]
peektrace-core.workspace = true
peektrace-protocol.workspace = true
peektrace-server.workspace = true
anyhow.workspace = true
clap.workspace = true
jiff.workspace = true
terminal_size.workspace = true
tracing.workspace = true
thiserror.workspace = true
tracing-subscriber.workspace = true
unicode-width.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros"] }
ureq = { version = "3", default-features = false, features = ["gzip"] }
url = "2"

[features]
default = []
# `--remote https://...` support (adds rustls).
https = ["ureq/rustls"]

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
