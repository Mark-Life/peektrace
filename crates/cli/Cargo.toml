[package]
name = "peektrace-cli"
description = "peektrace command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "peektrace"
path = "src/main.rs"

[dependencies]
peektrace-core.workspace = true
peektrace-protocol.workspace = true
peektrace-server.workspace = true
peektrace-tui.workspace = true
peektrace-telemetry.workspace = true
anyhow.workspace = true
clap.workspace = true
jiff.workspace = true
regex.workspace = true
terminal_size.workspace = true
tracing.workspace = true
thiserror.workspace = true
tracing-subscriber.workspace = true
unicode-width.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros", "time", "sync"] }
ureq = { version = "3", default-features = false, features = ["gzip"] }
url = "2"
clap_complete = { version = "4", default-features = false }
flate2 = "1"
sha2 = { version = "0.10", default-features = false }

[features]
default = []
# `--remote https://...` support (adds rustls).
https = ["ureq/rustls"]
# Built-in Rune web app for `serve --ui rune` (run scripts/rust/build-rune-web.sh first).
rune-ui = ["peektrace-server/rune-ui"]

[dev-dependencies]
rusqlite.workspace = true
serde_json.workspace = true

[lints]
workspace = true
