[package]
name = "peektrace-app"
description = "peektrace desktop app and web build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "app"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "peektrace-app"
path = "src/main.rs"

[dependencies]
peektrace-ui.workspace = true
rune.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rune = { workspace = true, features = ["accessibility", "dbus", "metal-backend", "svg"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rune = { workspace = true, features = ["svg"] }
wasm-bindgen = "=0.2.129"

[lints]
workspace = true
