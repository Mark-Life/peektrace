<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peektrace</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0a; color: #ebebeb; font: 14px system-ui, sans-serif; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; line-height: 1.5; }
  code { background: #222; padding: 1px 4px; border-radius: 4px; }
</style>
</head>
<body>
<div id="status">Loading…</div>
<script type="module">
const status = document.querySelector('#status');
const fallback = () => {
  status.innerHTML = 'This view needs WebGPU. Open it in a current Chrome or Edge, use the desktop app ' +
    '(<code>peektrace-app</code>), or run <code>peektrace serve</code> without ' +
    '<code>--ui rune</code> for the classic inspector.';
};
const adapter = navigator.gpu ? await navigator.gpu.requestAdapter().catch(() => null) : null;
if (!adapter) {
  fallback();
} else {
  try {
    const { default: init } = await import('./app.js');
    await init();
    status.remove();
  } catch (e) {
    status.textContent = String(e);
    console.error(e);
  }
}
</script>
</body>
</html>
