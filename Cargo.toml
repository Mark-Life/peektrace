[workspace]
resolver = "3"
members = ["crates/core", "crates/protocol", "crates/server", "crates/cli", "crates/tui", "crates/telemetry"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
peektrace-core = { path = "crates/core" }
peektrace-protocol = { path = "crates/protocol" }
peektrace-server = { path = "crates/server" }
peektrace-tui = { path = "crates/tui" }
peektrace-telemetry = { path = "crates/telemetry" }
anyhow = "1.0.104"
jiff = { version = "0.2.37", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-always"] }
fancy-regex = { version = "0.20", default-features = false, features = ["std", "perf"] }
icu_collator = { version = "2.4", features = ["unstable"] }
indexmap = "2.14"
sha1_smol = "1.0"
notify = "8"
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
rayon = "1.12"
regex = { version = "1.13", default-features = false, features = ["std", "perf", "unicode-case", "unicode-gencat"] }
rusqlite = { version = "0.42", default-features = false, features = ["bundled"] }
serde = "1.0"
serde_json = { version = "1.0.151", features = ["float_roundtrip", "unbounded_depth"] }
terminal_size = "0.4.4"
thiserror = "2.0.19"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry"] }
unicode-width = "0.2.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
